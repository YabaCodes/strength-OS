<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Strength OS — local-first workout tracking, progression and muscle analytics." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Strength OS</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-wrap">
        <img src="./assets/strength-os-icon.png" alt="Strength OS logo" class="brand-logo" />
        <div class="brand-block">
          <p class="eyebrow" id="todayLabel"></p>
          <h1>Strength OS</h1>
        </div>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="btn ghost hidden" type="button">Install</button>
        <button id="quickWeightBtn" class="icon-btn" type="button" aria-label="Log body weight">⚖</button>
      </div>
    </header>

    <main id="view" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-btn active" data-view="train" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.5h2.2m13.6 0H21M7 8v5m10-5v5M5.2 8h1.8v5H5.2zm11.8 0h1.8v5H17zm-10 1.5h10"/></svg></span><small>Train</small>
      </button>
      <button class="nav-btn" data-view="programs" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3v2m10-2v2M4.5 8h15M6 5.5h12a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 18 18.5H6A1.5 1.5 0 0 1 4.5 17V7A1.5 1.5 0 0 1 6 5.5Z"/><path d="M8 11h3M8 14h5M15.5 12.5l1.2 1.2 2-2.4"/></svg></span><small>Programs</small>
      </button>
      <button class="nav-btn" data-view="history" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg></span><small>History</small>
      </button>
      <button class="nav-btn" data-view="progress" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 19V11"/><path d="M12 19V7"/><path d="M19 19V4"/><path d="M3.5 19.5h17"/></svg></span><small>Progress</small>
      </button>
      <button class="nav-btn" data-view="more" type="button">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></span><small>More</small>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="restTimer" class="rest-timer hidden" aria-live="polite">
      <div><strong id="restTimerLabel">Rest</strong><span id="restTimerValue">01:30</span></div>
      <button id="cancelTimer" type="button">Stop</button>
    </div>

    <dialog id="modal" class="modal">
      <form method="dialog" class="modal-card" id="modalForm">
        <div class="modal-head">
          <div><p class="eyebrow" id="modalEyebrow"></p><h2 id="modalTitle">Edit</h2></div>
          <button class="icon-btn" value="cancel" type="submit" aria-label="Close">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div id="modalActions" class="modal-actions"></div>
      </form>
    </dialog>
  </div>

  <script src="./seed.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
