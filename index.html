<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Strength OS — local-first workout tracking, progression and muscle analytics." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>Strength OS</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand-wrap">
        <img src="./assets/strength-os-icon.png" alt="Strength OS logo" class="brand-logo" />
        <div class="brand-block">
          <p class="eyebrow" id="todayLabel"></p>
          <div class="brand-title-row"><h1>Strength OS</h1><span id="appVersionLabel" class="version-badge">v2.5.0</span></div>
        </div>
      </div>
      <div class="top-actions">
        <button id="installBtn" class="btn ghost hidden" type="button">Install</button>
        <button id="quickWeightBtn" class="icon-btn quick-action-icon" type="button" aria-label="Log body weight" title="Log body weight">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="3.5" width="16" height="17" rx="4"/>
            <path d="M8.5 9a3.5 3.5 0 0 1 7 0"/>
            <path d="M12 9l2-2"/>
            <path d="M8 16h8"/>
          </svg>
        </button>
      </div>
    </header>

    <main id="view" class="content" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-btn active" data-view="train" type="button" aria-label="Train">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M2.75 9.5v5M5.25 7.25v9.5M18.75 7.25v9.5M21.25 9.5v5M5.25 12h13.5"/>
          </svg>
        </span><small>Train</small>
      </button>
      <button class="nav-btn" data-view="programs" type="button" aria-label="Programs">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3.5" y="5" width="17" height="15" rx="2.5"/>
            <path d="M7.5 3.5v3M16.5 3.5v3M3.5 9h17"/>
            <path d="m8 14 2 2 5-5"/>
          </svg>
        </span><small>Programs</small>
      </button>
      <button class="nav-btn" data-view="history" type="button" aria-label="History">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8.5"/>
            <path d="M12 7.5V12l3.2 2"/>
          </svg>
        </span><small>History</small>
      </button>
      <button class="nav-btn" data-view="progress" type="button" aria-label="Progress">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 20h16"/>
            <rect x="5" y="12" width="3" height="6" rx="1"/>
            <rect x="10.5" y="8" width="3" height="10" rx="1"/>
            <rect x="16" y="4" width="3" height="14" rx="1"/>
          </svg>
        </span><small>Progress</small>
      </button>
      <button class="nav-btn" data-view="more" type="button" aria-label="More">
        <span class="nav-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle class="nav-dot" cx="5" cy="12" r="1.4"/>
            <circle class="nav-dot" cx="12" cy="12" r="1.4"/>
            <circle class="nav-dot" cx="19" cy="12" r="1.4"/>
          </svg>
        </span><small>More</small>
      </button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="restTimer" class="rest-timer hidden" aria-live="polite">
      <div class="rest-copy"><strong id="restTimerLabel">Rest</strong><span id="restTimerValue">01:30</span></div>
      <div class="rest-controls" aria-label="Rest timer controls">
        <button id="restMinusBtn" type="button" aria-label="Subtract 30 seconds">−30</button>
        <button id="restPlusBtn" type="button" aria-label="Add 30 seconds">+30</button>
        <button id="cancelTimer" type="button">Skip</button>
      </div>
    </div>

    <dialog id="modal" class="modal">
      <form method="dialog" class="modal-card" id="modalForm">
        <div class="modal-head">
          <div><p class="eyebrow" id="modalEyebrow"></p><h2 id="modalTitle">Edit</h2></div>
          <button class="icon-btn" value="cancel" type="submit" aria-label="Close">×</button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div id="modalActions" class="modal-actions"></div>
      </form>
    </dialog>
  </div>

  <script src="./seed.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
